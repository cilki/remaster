# Base PCSX2 config for every game; game-specific overrides go in the game
# directory's pcsx2.ini (mounted at /workspace/pcsx2.ini) and are merged over
# this by launch.sh via pcsx2ini.py.
#
# SettingsVersion must be present or PCSX2 resets the config and re-runs the
# first-run wizard. EnablePINE lets pcsx2-mcp connect to stock PCSX2 (port
# 28011). Pad 1 is bound explicitly to PCSX2's stock keyboard layout (arrows =
# d-pad, WASD/TFGH = sticks, IJKL = face buttons) so the agent can drive the
# game deterministically via wtype; the mapping is documented in SKILL.md and
# must stay in sync with it. Keyboard "analog" input is full-deflection only.

[UI]
SettingsVersion = 1
SetupWizardIncomplete = false

[EmuCore]
EnablePINE = true

[GameList]
RecursivePaths = /workspace/game

# F7/F6 serve the HD texture pack loop: F7 reloads replacements in place, F6
# toggles them off/on for A/B comparison.
[Hotkeys]
Screenshot = Keyboard/F8
ReloadTextureReplacements = Keyboard/F7
ToggleTextureReplacements = Keyboard/F6

[Pad1]
Type = DualShock2
Up = Keyboard/Up
Down = Keyboard/Down
Left = Keyboard/Left
Right = Keyboard/Right
Triangle = Keyboard/I
Circle = Keyboard/L
Cross = Keyboard/K
Square = Keyboard/J
Select = Keyboard/Backspace
Start = Keyboard/Return
L1 = Keyboard/Q
L2 = Keyboard/1
R1 = Keyboard/E
R2 = Keyboard/3
L3 = Keyboard/2
R3 = Keyboard/4
LUp = Keyboard/W
LLeft = Keyboard/A
LDown = Keyboard/S
LRight = Keyboard/D
RUp = Keyboard/T
RLeft = Keyboard/F
RDown = Keyboard/G
RRight = Keyboard/H
