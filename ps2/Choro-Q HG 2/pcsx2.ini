# Road Trip's PCSX2 overrides, merged over the base config by launch.sh.
#
# upscale_multiplier = 4 renders at 2560x1792 and supersamples down — the
# single largest visual change in the project; MaxAnisotropy matters most for
# the road and ground planes seen at a shallow angle. The texture keys drive
# the HD pack loop: dumps grow as the game is played (the reload/toggle
# hotkeys F7/F6 are bound in the base config).

[EmuCore/GS]
upscale_multiplier = 4
MaxAnisotropy = 16
DumpReplaceableTextures = true
LoadTextureReplacements = true
